<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' - SimpleBoard'">SimpleBoard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <style>
        .board-container { max-width: 900px; }
        .pre-wrap { white-space: pre-wrap; word-break: break-word; }
        .attachment-preview { max-height: 480px; }
    </style>
</head>

<body>

<header th:fragment="header" class="border-bottom bg-light mb-4">
    <nav class="container board-container d-flex justify-content-between align-items-center py-3">
        <a href="/" th:href="@{/}" class="fs-4 fw-bold text-decoration-none text-dark">SimpleBoard</a>
        <div th:if="${loginMember == null}">
            <a th:href="@{/login}" class="btn btn-sm btn-outline-primary">로그인</a>
            <a th:href="@{/signup}" class="btn btn-sm btn-primary">회원가입</a>
        </div>
        <div th:if="${loginMember != null}" class="d-flex align-items-center gap-2">
            <span><strong th:text="${loginMember.nickname}">홍길동</strong>님</span>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-sm btn-outline-secondary">로그아웃</button>
            </form>
        </div>
    </nav>
</header>

<footer th:fragment="footer" class="border-top mt-5 py-3 text-center text-muted small">
    © 2026 SimpleBoard
</footer>

</body>
</html>
